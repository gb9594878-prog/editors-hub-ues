name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3

      - name: Install deps
        run: |
          pnpm install --no-frozen-lockfile
          ls node_modules/.bin | grep expo || pnpm add -w expo @expo/cli

      - name: Prebuild
        run: |
          npx expo prebuild --platform android --clean --no-install
          pnpm install --no-frozen-lockfile

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint --stacktrace > /tmp/log.txt 2>&1 || true
          cat /tmp/log.txt
          echo "===== REAL ERROR ====="
          grep -n -A20 "What went wrong\|FAILED\|error:" /tmp/log.txt | head -n 100
          # fail again properly to see
          ./gradlew assembleRelease --no-daemon -x lint

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EditorsHub-APK
          path: android/app/build/outputs/apk/release/*.apk
