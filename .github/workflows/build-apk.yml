name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Install ALL deps (root + workspace)
        run: |
          pnpm install --no-frozen-lockfile
          # agar workspace ke andar hai to wahan bhi install karo
          for dir in $(find . -maxdepth 3 -name "package.json" -exec dirname {} \; | head -10); do
            echo "Installing in $dir"
            (cd $dir && pnpm install --no-frozen-lockfile || true)
          done
          npm install -g expo-cli eas-cli || true

      - name: Prebuild Android (auto-find)
        run: |
          APP_DIR=$(find . -maxdepth 4 -name "app.json" -exec dirname {} \; | head -1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR="."
          fi
          echo "Expo project found at: $APP_DIR"
          ls -la $APP_DIR
          cd $APP_DIR
          npx --yes expo prebuild --platform android --clean
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1

      - name: Build APK (auto-find android folder)
        run: |
          ANDROID_DIR=$(find . -name "gradlew" -exec dirname {} \; | head -1)
          echo "Android dir: $ANDROID_DIR"
          cd $ANDROID_DIR
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EditorsHub-APK
          path: |
            **/android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/*.apk
