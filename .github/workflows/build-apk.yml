name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter editor-hub exec expo prebuild --platform android --clean
      - run: pnpm --filter editor-hub exec bash -c "cd android && chmod +x gradlew && ./gradlew assembleRelease"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: editor-hub/android/app/build/outputs/apk/release/app-release.apk
