name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Find project structure
        run: |
          pwd
          ls -la
          cat pnpm-workspace.yaml 2>&1 || echo "no workspace file"
          find . -maxdepth 3 -name "app.json" -o -name "app.config.*"

      - name: Prebuild Android
        run: npx --yes expo prebuild --platform android --clean
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EditorsHub-APK
          path: android/app/build/outputs/apk/release/*.apk
