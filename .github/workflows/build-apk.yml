name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Find App & Install
        run: |
          APP_FILE=$(find . -maxdepth 4 -type f -name "app.json" | head -1)
          if [ -z "$APP_FILE" ]; then APP_DIR="."; else APP_DIR=$(dirname "$APP_FILE"); fi
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV
          pnpm install --no-frozen-lockfile
          cd "$APP_DIR"
          pnpm install --no-frozen-lockfile || true
          [ -d "node_modules/expo" ] || pnpm add -w expo

      - name: Prebuild Android
        run: |
          cd "${{ env.APP_DIR }}"
          pnpm exec expo prebuild --platform android --clean --no-install
          pnpm install --no-frozen-lockfile

      - name: Build APK
        run: |
          cd "${{ env.APP_DIR }}/android"
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease --no-daemon -x lint --stacktrace 2>&1 | tee build.log
          echo "---- FAILED TASK ----"
          grep -B5 -A20 "What went wrong\|FAILED\|Execution failed" build.log | tail -n 100

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EditorsHub-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/*.apk
