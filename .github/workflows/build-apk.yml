name: build-apk-final
on: [push]

jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   # 1. Code checkout
   - uses: actions/checkout@v4

   # 2. pnpm setup - teri "Use pnpm instead" error ka fix
   - uses: pnpm/action-setup@v4
     with: { version: 9 }

   # 3. Node & Java & Android SDK
   - uses: actions/setup-node@v4
     with: { node-version: 20 }
   - uses: actions/setup-java@v4
     with: { distribution: 'temurin', java-version: '17' }
   - uses: android-actions/setup-android@v3

   # --- YAHAN SE SAARE FIX START HOTE HAI ---

   # FIX 1: pnpm-lock.yaml not found wala error khatam + cache error khatam
   # FIX 2: expo not found ke liye symlink fix
   - run: |
       echo "shamefully-hoist=true" >.npmrc
       echo "ignore-workspace-root-check=true" >>.npmrc

   # FIX 3: purana node_modules ka kachra saaf
   - run: rm -rf node_modules android

   # FIX 4: package.json se preinstall wala block hatana (jo npm ko rok raha tha)
   - run: |
       node -e "
       const fs=require('fs');
       const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
       if(pkg.scripts && pkg.scripts.preinstall){ delete pkg.scripts.preinstall; fs.writeFileSync('package.json', JSON.stringify(pkg,null,2)); console.log('preinstall removed'); }
       "

   # FIX 5: expo module not installed wala error - zabardasti expo install
   - run: pnpm add -w expo@57.0.19

   # FIX 6: saare package sahi se install
   - run: pnpm install --no-frozen-lockfile

   # FIX 7: android folder banana
   - run: npx expo prebuild --platform android --clean --no-install

   # FIX 8: Tera last wala error - Minimum supported Gradle is 9.4.1 wala
   - run: |
       sed -i 's/gradle-.*-bin.zip/gradle-9.4.1-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
       cat
