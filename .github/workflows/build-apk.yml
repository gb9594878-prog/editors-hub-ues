name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Show files (to find app)
        run: |
          pwd
          ls -la
          ls -la editors-hub-ues 2>&1 || true
          find . -maxdepth 3 -type f -name "package.json" | head -20
          find . -maxdepth 4 -type f \( -name "app.json" -o -name "app.config.*" \) | head -20

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Prebuild Android
        working-directory: ./editors-hub-ues
        run: npx expo prebuild --platform android --clean
        env:
          CI: 1

      - name: Build APK
        working-directory: ./editors-hub-ues/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EditorsHub-APK
          path: editors-hub-ues/android/app/build/outputs/apk/release/*.apk
