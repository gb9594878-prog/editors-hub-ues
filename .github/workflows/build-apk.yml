name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Find App & Install
        run: |
          APP_FILE=$(find . -maxdepth 4 -type f -name "app.json" | head -1)
          if [ -z "$APP_FILE" ]; then APP_DIR="."; else APP_DIR=$(dirname "$APP_FILE"); fi
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV
          echo "App dir: $APP_DIR"
          
          pnpm install --no-frozen-lockfile
          cd "$APP_DIR"
          pnpm install --no-frozen-lockfile || true
          if [ ! -d "node_modules/expo" ]; then
            pnpm add -w expo
          fi

      - name: Prebuild Android
        run: |
          cd "${{ env.APP_DIR }}"
          # --no-install = permission nahi mangega, isliye fail nahi hoga
          pnpm exec expo prebuild --platform android --clean --no-install
          # ab updated deps ko install kar lo
          pnpm install --no-frozen-lockfile

      - name: Build APK
        run: |
          cd "${{ env.APP_DIR }}/android"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EditorsHub-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/*.apk
