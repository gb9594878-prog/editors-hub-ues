name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      
      - name: Install
        run: |
          pnpm install --no-frozen-lockfile
          pnpm add -w expo @expo/cli || true

      - name: Prebuild
        run: |
          npx expo prebuild --platform android --clean --no-install
          pnpm install --no-frozen-lockfile

      - name: Check JS Bundle First (Real Error Yaha Dikhega)
        run: |
          export NODE_OPTIONS=--max-old-space-size=4096
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output /tmp/test.bundle --assets-dest /tmp --reset-cache || npx react-native bundle --platform android --dev false --entry-file App.js --bundle-output /tmp/test.bundle --assets-dest /tmp --reset-cache || npx expo export --platform android --dump-sourcemap || true
          echo "If above failed, the real JS error is printed"

      - name: Build APK
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EditorsHub-APK
          path: android/app/build/outputs/apk/release/*.apk
