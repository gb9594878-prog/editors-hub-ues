name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Install deps (MONOREPO FIX)
        run: |
          # Root + saare workspaces me install
          pnpm install --no-frozen-lockfile
          pnpm -r install --no-frozen-lockfile || true
          
          # App folder dhoondo jahan app.json hai
          APP_DIR=$(find . -maxdepth 4 -name "app.json" | head -1 | xargs dirname)
          if [ -z "$APP_DIR" ]; then APP_DIR="."; fi
          echo "App found at: $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV
          ls -la $APP_DIR

      - name: Fix expo in app folder
        run: |
          echo "Fixing in $APP_DIR"
          cd ${{ env.APP_DIR }}
          if [ ! -d "node_modules/expo" ]; then
            echo "expo missing in app folder, installing..."
            pnpm add expo || npm install expo --legacy-peer-deps
          fi

      - name: Prebuild Android
        run: |
          cd ${{ env.APP_DIR }}
          npx expo prebuild --platform android --clean
        env:
          CI: 1

      - name: Build APK
        run: |
          cd ${{ env.APP_DIR }}/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EditorsHub-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/*.apk
