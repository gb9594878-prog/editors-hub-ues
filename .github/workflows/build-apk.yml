name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Fix pnpm hoist
        run: |
          rm -rf node_modules android
          echo "shamefully-hoist=true" >.npmrc
          echo "node-linker=hoisted" >>.npmrc
          echo "strict-peer-dependencies=false" >>.npmrc
          cat.npmrc

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm dlx expo@57.0.19 prebuild --platform android --clean --no-install
      - run: sed -i 's/gradle-.*-bin.zip/gradle-9.4.1-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
      - run: cd android && chmod +x gradlew &&./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
