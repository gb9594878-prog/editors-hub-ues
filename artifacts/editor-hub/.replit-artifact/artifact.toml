kind = "mobile"
previewPath = "/"
title = "Editor Hub"
description = "A dark, modern mobile companion for video editors to browse editing guides, discover creator resources, and manage a personal editing profile."
version = "1.0.0"
id = "artifacts/editor-hub"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21828

[services.development]
run = "pnpm --filter @workspace/editor-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/editor-hub", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/editor-hub", "run", "serve" ]

[services.env]
PORT = "21828"
BASE_PATH = "/"
